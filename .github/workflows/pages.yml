name: Publicar utilidades MP protegidas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar interfaz pública
        run: |
          test -f site/index.html
          test -f site/stock/index.html
          test -f site/transferencias/index.html
          ! grep -rE 'sb_secret_|"payload_gzip_base64"[[:space:]]*:|service_role' site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
